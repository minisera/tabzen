name: Scorecard supply-chain security

on:
  branch_protection_rule:
  schedule:
    # 毎週月曜 05:00 UTC (= 14:00 JST)
    - cron: '0 5 * * 1'
  push:
    branches: [main]

# トップレベルは最小権限。job 内で必要なものだけ拡張する。
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # SARIF を Security タブに upload するため
      security-events: write
      # 結果を OpenSSF API に publish するため (badge 用)
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # public repo は OpenSSF レジストリに publish 可能 (badge 取得用)
          publish_results: true

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to GitHub code scanning
        uses: github/codeql-action/upload-sarif@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
        with:
          sarif_file: results.sarif
